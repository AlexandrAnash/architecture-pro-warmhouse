server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Web-STOMP RabbitMQ проксируем через СВОЙ origin — браузеру не нужен прямой
    # доступ к :15674, а фронт работает на любом хосте (ws/wss по origin страницы).
    location /ws {
        proxy_pass http://rabbitmq:15674;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;          # WS — долгоживущее соединение
        proxy_send_timeout 3600s;
    }

    # SPA: любой путь отдаём в index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
