server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── reverse-proxy на бэкенды (имена сервисов в сети docker-compose) ──
    # Монолит
    location /svc/smarthome/ {
        proxy_pass http://app:8080/;
    }
    # Микросервисы
    location /svc/temperature/ {
        proxy_pass http://temperature-api:8081/;
    }
    location /svc/device-manager/ {
        proxy_pass http://device-manager:8082/;
    }
    location /svc/telemetry/ {
        proxy_pass http://telemetry:8083/;
    }

    # SPA-фолбэк
    location / {
        try_files $uri $uri/ /index.html;
    }
}
