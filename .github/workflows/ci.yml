name: CI
on:
  push:
    branches: [main, warmhouse, deploy-branch]
  pull_request:

concurrency:                                   # отменять устаревшие запуски той же ветки
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write            # для загрузки результатов в Security tab (опц.)
    strategy:
      fail-fast: false
      matrix:
        service: [smart_home, temperature-api, device-manager, telemetry, sensor-fe, dashboard-fe]
    env:
      IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3    # buildx — нужен для кэша слоёв
      - uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      - name: Build (load locally, ещё не push)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          load: true                       # ← в локальный docker, НЕ в реестр
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan (Trivy) — гейт
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH          # падаем только на серьёзных
          ignore-unfixed: true             # не валимся на то, для чего нет фикса
          exit-code: '1'                   # ← findings → job падает → push не будет

      - name: Push (только если скан прошёл)
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker tag  ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:latest