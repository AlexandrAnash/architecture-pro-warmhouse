name: CI
on:
  push:
    branches: [main, warmhouse, deploy-branch]
  pull_request:

concurrency:                                   # отменять устаревшие запуски той же ветки
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false                         # ← один сломанный сервис не отменяет остальные
      matrix:
        service:
          - smart_home
          - temperature-api
          - device-manager
          - telemetry
          - sensor-fe
          - dashboard-fe
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3    # buildx — нужен для кэша слоёв

      - uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ matrix.service }}:${{ github.sha }}
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ matrix.service }}:latest
          cache-from: type=gha                 # ← читаем кэш слоёв из GitHub Actions cache
          cache-to: type=gha,mode=max          # ← пишем кэш обратно